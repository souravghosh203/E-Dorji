<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">E-দর্জি</title>
  <desc id="desc">A custom emerald E formed with a clothes hanger, a golden measuring tape, and a Bengali দর্জি wordmark with needle and thread.</desc>
  <defs>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00796B"/>
      <stop offset=".52" stop-color="#00695C"/>
      <stop offset="1" stop-color="#003F46"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2=".25">
      <stop offset="0" stop-color="#FFB300"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="needle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#455A64"/>
      <stop offset=".45" stop-color="#263238"/>
      <stop offset="1" stop-color="#003F46"/>
    </linearGradient>
    <filter id="soft-shadow" x="-.12" y="-.12" width="1.24" height="1.24" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#003F46" flood-opacity=".12"/>
    </filter>
  </defs>

  <g id="mark" filter="url(#soft-shadow)">
    <!-- Custom E monogram -->
    <path fill="url(#emerald)" d="M585 330H248c-72 0-116 45-116 119v221c0 74 44 119 116 119h337v-91H266c-31 0-44-15-44-45v-54h300v-87H222v-48c0-29 13-43 44-43h319z"/>
    <!-- Hanger hook and shoulder line -->
    <path d="M365 226c-4-33 43-38 43-78 0-31-25-47-52-38-20 7-29 24-29 42" fill="none" stroke="url(#emerald)" stroke-width="26" stroke-linecap="round"/>
    <path d="M365 220 143 329c-14 7-10 20 7 20h438c17 0 21-13 7-20L373 220" fill="none" stroke="url(#emerald)" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Measuring tape crossing the E -->
    <path d="M101 565c142 17 286-115 535-126l21 67c-236 14-383 159-537 139-36-5-56-22-64-47-8-25 9-37 45-33z" fill="url(#gold)"/>
    <g fill="none" stroke="#263238" stroke-width="8" stroke-linecap="round">
      <path d="m150 567 7 29"/><path d="m206 565 8 32"/><path d="m266 551 8 31"/>
      <path d="m326 527 8 31"/><path d="m386 504 8 31"/><path d="m446 482 8 31"/>
      <path d="m506 462 8 29"/><path d="m558 450 7 25"/>
    </g>
    <!-- Four-hole button -->
    <circle cx="443" cy="706" r="34" fill="#003F46" stroke="#E8F2EF" stroke-width="5"/>
    <g fill="#FFFFFF"><circle cx="431" cy="694" r="5.5"/><circle cx="455" cy="694" r="5.5"/><circle cx="431" cy="718" r="5.5"/><circle cx="455" cy="718" r="5.5"/></g>
  </g>

  <g id="thread" fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M786 369c41-128 144-184 267-163 82 14 147 54 217 22 50-23 71-72 49-91-24-20-61 2-77 39-25 59 13 119 80 124 55 4 93-14 133-49" stroke-width="13"/>
    <path d="M744 807c173-94 350-135 547-132 74 1 142 9 199 24" stroke-width="8"/>
  </g>
  <!-- Tailoring needle -->
  <g id="needle" transform="rotate(32 1356 235)">
    <path d="M1356 95c-22 0-36 16-36 39v187l36 57 36-57V134c0-23-14-39-36-39z" fill="url(#needle)" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
    <ellipse cx="1356" cy="137" rx="10" ry="19" fill="#FFFFFF"/>
    <path d="M1356 378 1345 351h22z" fill="#263238"/>
  </g>
  <!-- Bengali wordmark; live text keeps the spelling editable and selectable. -->
  <text x="710" y="624" fill="#003F46" font-family="Noto Serif Bengali, Hind Siliguri, serif" font-size="280" font-weight="700" letter-spacing="-8">-দর্জি</text>
</svg>
