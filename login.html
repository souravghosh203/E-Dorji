<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Log in · E-দর্জি</title><link rel="icon" type="image/svg+xml" href="assets/e-dorji-icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+Bengali:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/portal.css"><script type="module" src="assets/portal.js"></script>
</head>
<body class="portal-page">
<div id="site-nav-root" data-page="login"></div>
<main class="portal-layout"><section class="portal-story"><div><p class="portal-kicker" data-copy="loginStoryKicker">Made for your next favorite outfit</p><h1 data-copy="loginStoryTitle">Good to have you back.</h1><p data-copy="loginStoryCopy">Find your tailor, keep your design details close, and follow every stitch.</p></div><img class="mini-logo" src="assets/e-dorji-logo.svg" alt="E-দর্জি"></section>
<section class="portal-card" aria-labelledby="login-title"><h2 id="login-title" data-copy="loginTitle">Welcome back</h2><p class="portal-lead" data-copy="loginLead">Log in to your E-দর্জি account.</p><form class="portal-form" id="login-form"><label><span data-copy="identityLabel">Email or phone</span><input name="identity" autocomplete="username" required placeholder="you@example.com or phone number" data-placeholder="identityPlaceholder"></label><label><span data-copy="passwordLabel">Password</span><input name="password" type="password" autocomplete="current-password" required minlength="8" placeholder="At least 8 characters" data-placeholder="passwordPlaceholder"></label><a class="portal-forgot" href="about.html" data-copy="helpLink">Need help?</a><button type="submit" data-copy="loginButton">Log in</button><p class="portal-status" id="login-status" role="status" aria-live="polite"></p></form><p class="portal-switch"><span data-copy="loginSwitch">New to E-দর্জি?</span> <a href="register.html" data-copy="createAccount">Create an account</a></p></section></main>
<script type="module" src="/src/main.jsx"></script></body></html>
