<body class="portal-page">

<main class="portal-layout"><section class="portal-story"><div><p class="portal-kicker">SECURE ADMIN ACCESS</p><h1>Welcome back to your workspace.</h1><p>Sign in with the administrator account provisioned for this E-Dorji installation.</p></div><img class="mini-logo" src="assets/e-dorji-logo.svg" alt="E-Dorji"></section>
<section class="portal-card" aria-labelledby="admin-login-title"><h2 id="admin-login-title">Administrator sign in</h2><p class="portal-lead">This access is reserved for authorized E-Dorji administrators.</p><form class="portal-form" id="admin-login-form"><label><span>Email address</span><input name="email" type="email" autocomplete="username" required placeholder="admin@example.com"></label><label><span>Password</span><input name="password" type="password" autocomplete="current-password" required minlength="10" placeholder="Your administrator password"></label><button type="submit">Sign in securely</button><p class="portal-status" id="admin-login-status" role="status" aria-live="polite"></p></form><p class="portal-switch"><a href="login.html">Return to customer sign in</a></p></section></main>
