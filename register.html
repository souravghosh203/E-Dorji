<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Create an account · E-দর্জি</title><link rel="icon" type="image/svg+xml" href="assets/e-dorji-icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+Bengali:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/portal.css"><script type="module" src="assets/portal.js"></script>
</head>
<body class="portal-page">
<div id="site-nav-root" data-page="register"></div>
<main class="portal-layout"><section class="portal-story"><div><p class="portal-kicker" data-copy="registerStoryKicker">A better fit starts here</p><h1 data-copy="registerStoryTitle">Made around you.</h1><p data-copy="registerStoryCopy">Create an account to meet local artisans and bring your ideas to life.</p></div><img class="mini-logo" src="assets/e-dorji-logo.svg" alt="E-দর্জি"></section>
<section class="portal-card" aria-labelledby="register-title"><h2 id="register-title" data-copy="registerTitle">Create your account</h2><p class="portal-lead" data-copy="registerLead">Tell us a little about yourself.</p><form class="portal-form" id="register-form"><label><span data-copy="nameLabel">Full name</span><input name="name" autocomplete="name" required placeholder="Your name" data-placeholder="namePlaceholder"></label><label><span data-copy="emailLabel">Email address</span><input name="email" type="email" autocomplete="email" required placeholder="you@example.com" data-placeholder="emailPlaceholder"></label><label><span data-copy="phoneLabel">Phone number</span><input name="phone" type="tel" autocomplete="tel" required placeholder="Your mobile number" data-placeholder="phonePlaceholder"></label><label><span data-copy="cityLabel">City</span><input name="city" autocomplete="address-level2" required placeholder="Your city" data-placeholder="cityPlaceholder"></label><label><span data-copy="passwordLabel">Password</span><input name="password" type="password" autocomplete="new-password" required minlength="10" placeholder="At least 10 characters"></label><label><span data-copy="confirmPasswordLabel">Confirm password</span><input name="confirm" type="password" autocomplete="new-password" required minlength="10" placeholder="Enter your password again" data-placeholder="confirmPasswordPlaceholder"></label><button type="submit" data-copy="createAccount">Create account</button><p class="portal-status" id="register-status" role="status" aria-live="polite"></p></form><p class="portal-switch"><span data-copy="alreadyAccount">Already have an account?</span> <a href="login.html" data-copy="loginButton">Log in</a></p></section></main>
<div id="site-footer-root"></div>
<script type="module" src="/src/main.jsx"></script></body></html>
