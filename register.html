<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Create an account · E-দর্জি</title><link rel="icon" type="image/svg+xml" href="assets/e-dorji-icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+Bengali:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/portal.css"><script type="module" src="assets/portal.js"></script>
</head>
<body class="portal-page">
<div id="site-nav-root" data-page="register"></div>
<main class="portal-layout"><section class="portal-story"><div><p class="portal-kicker">A better fit starts here</p><h1>Made around you.</h1><p>Create an account to meet local artisans and bring your ideas to life.</p></div><img class="mini-logo" src="assets/e-dorji-logo.svg" alt="E-দর্জি"></section>
<section class="portal-card" aria-labelledby="register-title"><h2 id="register-title">Create your account</h2><p class="portal-lead">Tell us a little about yourself.</p><form class="portal-form" id="register-form"><label>Full name<input name="name" autocomplete="name" required placeholder="Your name"></label><label>Email address<input name="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label>Phone number<input name="phone" type="tel" autocomplete="tel" required placeholder="Your mobile number"></label><label>City<input name="city" autocomplete="address-level2" required placeholder="Your city"></label><label>I am joining as<select name="role" required><option value="customer">Customer</option><option value="tailor">Tailor</option></select></label><label>Password<input name="password" type="password" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters"></label><label>Confirm password<input name="confirm" type="password" autocomplete="new-password" required minlength="8" placeholder="Enter your password again"></label><button type="submit">Create account</button><p class="portal-status" id="register-status" role="status" aria-live="polite"></p></form><p class="portal-switch">Already have an account? <a href="login.html">Log in</a></p></section></main>
<script type="module" src="/src/main.jsx"></script></body></html>
